server:
  port: 9090
  url: http://localhost:9090

spring:
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/stats
    username: stats
    password: stats
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

sql:
  init:
    mode: always
    schema-locations: classpath:schema.sql
