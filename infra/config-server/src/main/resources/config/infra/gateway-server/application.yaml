spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: gateway_actuator_route
          uri: http://localhost:8080
          predicates:
            - Path=/actuator/**

        # === REQUEST SERVICE (должен быть ПЕРВЫМ, чтобы перехватывать /users/*/requests) ===
        - id: request_service_private_route
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests,
              /users/{userId}/requests/**,
              /users/{userId}/events/{eventId}/requests,
              /users/{userId}/events/{eventId}/requests/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: INTERNAL_SERVER_ERROR

        - id: request_service_internal_route
          uri: lb://request-service
          predicates:
            - Path=/internal/requests/**

        - id: request_service_count_route
          uri: lb://request-service
          predicates:
            - Path=/requests/count
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: INTERNAL_SERVER_ERROR

        # === EVENT SERVICE ===
        - id: event_service_admin_route
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,
              /admin/categories/**,
              /admin/compilations/**

        - id: event_service_internal_route
          uri: lb://event-service
          predicates:
            - Path=/internal/events/**

        - id: event_service_private_route
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**

        - id: event_service_public_route
          uri: lb://event-service
          predicates:
            - Path=/events,
              /events/**,
              /compilations/**,
              /categories/**

        # === LOCATION SERVICE ===
        - id: location_service_internal_route
          uri: lb://location-service
          predicates:
            - Path=/internal/locations/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE

        - id: location_service_private_route
          uri: lb://location-service
          predicates:
            - Path=/users/{userId}/locations/**
          filters:
            - name: Retry
              args:
                retries: 3

        # === USER SERVICE ===
        - id: user_service_admin_route
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: user_service_internal_route
          uri: lb://user-service
          predicates:
            - Path=/internal/users/**

        - id: user_service_exists_route
          uri: lb://user-service
          predicates:
            - Path=/internal/users/{userId}/exists
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: NOT_FOUND, INTERNAL_SERVER_ERROR

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: gateway, health, info
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG